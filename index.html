<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="処方されたお薬の飲み方・使い方をまとめて、コピー・印刷・PDF保存できます。">
<title>お薬の飲み方・使い方</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f5;--card:#fff;--ink:#1c2733;--mute:#5d6b78;--line:#d5dde4;--acc:#0f6e8c;--acc-d:#0b566e;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:1.35rem;line-height:1.5;margin:8px 0 18px}
.greet{margin:8px 0 0}
.med{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:8px;padding:14px;margin-bottom:14px}
.med.bad{border-left-color:var(--bad)}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.num{font-size:1.1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.one{display:flex;flex-wrap:nowrap;gap:6px;margin:10px 0}
.one>*{min-width:0;flex:1 1 0;text-overflow:ellipsis}
.one>[data-f=time],.one>[data-f=food]{flex-grow:1.3}
.one>[data-f=durN]{flex-grow:.8}
.one>.dose{flex-grow:1.5;gap:4px}
.dose:empty{display:none}
.one>.dose>*{flex:1 1 40px;min-width:0}
@media(max-width:600px){.one{gap:4px}.one>*,.one .dose>*{font-size:.78rem;padding:8px 2px 8px 5px}}
.dose{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dose>*{flex:1 1 90px}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);min-height:44px}
input[type=checkbox]{width:22px;height:22px;min-height:0}
textarea{resize:vertical}
:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
select:disabled{background:#f1f4f6;color:#9aa6b1}
.prn{display:flex;gap:8px;align-items:center;font-size:.95rem;cursor:pointer}
.err{color:var(--bad);font-size:.9rem;margin:4px 0}
button{font:inherit;min-height:44px;padding:8px 16px;border-radius:6px;border:1px solid var(--acc);background:#fff;color:var(--acc-d);cursor:pointer}
button:hover{background:#e6f2f6}
button.main{background:var(--acc);color:#fff}
button.main:hover{background:var(--acc-d)}
button.del{border-color:var(--bad);color:var(--bad)}
.notewrap{display:flex;gap:8px}
.notewrap select{flex:1;min-width:0}
.notewrap button{flex:0 0 auto;white-space:nowrap;font-size:.9rem}
dialog{width:min(680px,94vw);border:1px solid var(--line);border-radius:10px;padding:16px;color:var(--ink);max-height:90vh}
dialog::backdrop{background:rgba(28,39,51,.5)}
dialog h2{font-size:1.2rem;margin:0 0 4px}
#noteList{max-height:55vh;overflow:auto;margin:10px 0}
.nrow{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
.nrow textarea{flex:1}
.acts{display:flex;gap:8px;margin-top:8px}
.bar{position:sticky;bottom:0;background:var(--bg);padding:10px 0;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line)}
.bar button{flex:1 1 120px}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:14px 0}
#prevText{margin:8px 0;min-height:220px;line-height:1.8}
.note{font-size:.88rem;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.on{opacity:1}
#sheet{display:none}
@media print{
  body{background:#fff}
  #app,#toast{display:none!important}
  #sheet{display:block;font-size:12pt}
  #sheet h1{font-size:16pt;border-bottom:2px solid #000;padding-bottom:4px}
  #sheet .item{break-inside:avoid;border-bottom:1px solid #999;padding:8px 0}
  #sheet .nm{font-weight:700;font-size:13pt}
  #sheet .when{font-size:12pt}
  #sheet .free{white-space:pre-wrap;line-height:1.9}
  #sheet .disc{margin-top:16px;font-size:10pt}
}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <p class="greet">平素よりお世話になっております。</p>
  <h1>本日、処方されたお薬の飲み方・使い方は下記でございます。</h1>

  <div id="meds"></div>
  <button id="add" class="main" type="button">＋ 薬を追加</button>

  <details id="prev"><summary>出力のプレビュー（編集できます）</summary>
    <textarea id="prevText" rows="14" placeholder="薬の名前を入力すると、ここに表示されます。" aria-label="出力のプレビュー（編集できます）"></textarea>
    <p class="note" id="customNote" hidden>手動で編集中です。この内容がコピー・印刷・PDFに使われ、上の入力を変えても上書きされません。</p>
    <button type="button" id="resetText" hidden>入力内容から作り直す</button>
  </details>
  <p class="note">この表は参考用です。医師・薬剤師の指示が最優先です。</p>

  <div class="bar">
    <button id="copy" class="main" type="button">テキストをコピー</button>
    <button id="print" type="button">印刷</button>
    <button id="pdf" type="button">PDF保存</button>
    <button id="clear" class="del" type="button">すべて消去</button>
  </div>
</div>

<dialog id="notesDlg" aria-labelledby="notesTitle">
  <h2 id="notesTitle">注意書きの管理</h2>
  <p class="note">追加・編集・削除ができます。空の欄は保存時に取り除かれます。</p>
  <div id="noteList"></div>
  <div class="acts">
    <button type="button" id="noteAdd">＋ 注意書きを追加</button>
    <button type="button" id="noteReset">初期の注意書きに戻す</button>
  </div>
  <div class="acts" style="justify-content:flex-end">
    <button type="button" id="noteCancel">キャンセル</button>
    <button type="button" class="main" id="noteSave">保存</button>
  </div>
</dialog>

<div id="sheet" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="drugs"></datalist>

<script>
const KEY = "nomikata:v2";
const DRUGS = "Accutane,Aciloc,Acitrom,Acyclovir,Adapalene,Aldactone,Allegra,Almox,Amaryl,Amlodac,Amlong,Apixaban,Arixtra,Ascoril,Asthalin,Atenolol,Atorfit,Atorlip,Augmentin,Avil,Avodart,Azee,Azithral,Bactrim,Bactroban,Becosules,Benadryl,Betadine,Betnovate,Biktarvy,Bisacodyl,Bisoprolol,Brufen,Budecort,Calamine,Calcimax,Calpol,Candid,Canesten,Cardace,Carvedilol,Cefixime,Cefuroxime,Ceftriaxone,Cetaphil,Cetzine,Cifran,Ciplox,Clavam,Clexane,Clindamycin,Clopitab,Combiflam,Concor,Corex,Crocin,Depakote,Dettol,Dexorange,Differin,Diflucan,Dolo-650,Domperidone,Doxycycline,Dulcolax,Duphalac,Ecosprin,Eliquis,Elocon,Eltroxin,Emeset,Ensure,Entecavir,Epilim,Erythrocin,Esomac,Evion,Famciclovir,Famotidine".split(",");
const TYPES = ["抗生剤","抗ウィルス剤","解熱鎮痛剤","痛み止め","抗炎症剤","抗アレルギー剤","咳止め","カルシウム用","鼻詰まり用","風邪用","整腸剤","目薬","筋弛緩剤","高血圧症治療薬","塗り薬","保湿剤","ローション","シャンプー","糖尿病治療薬","ビタミン剤","点鼻薬","下痢止め","吐き気止め","消毒薬","その他"];
const FORMS = ["錠剤","カプセル","粉薬","シロップ","点眼・点耳・点鼻","スプレー","その他"];
const FREQ = {"1日1回":["朝のみ","昼のみ","夜のみ"],"1日2回":["朝と夜","朝と昼","昼と夜"],"1日3回":["朝昼夜"],"1日4回":["朝昼夕寝る前"]};
const FOOD = ["食前後いつでも","食前","食後","食間"];
const NOTES = [
 "熱が37.5度以上ある場合だけお飲みください。続けて飲む場合は6時間ほどあけてください。",
 "体の痛みがある場合だけお飲みください。続けて飲む場合は6時間ほどあけてください。",
 "頭痛がある場合だけお飲みください。続けて飲む場合は6時間ほどあけてください。",
 "熱が37.5度以上、または体の痛みや頭痛がある場合にお飲みください。続けて飲む場合は6時間ほどあけてください。",
 "患部の痛みがある場合だけお飲みください。続けて飲む場合は6時間ほどあけてください。",
 "患部にお使いください。","患部だけにお塗りください。","お水に混ぜて飲み始めてください。",
 "1袋を1リットルのお水に混ぜて飲みください。",
 "Suspension Syrup薬の作り方手順：数回たたいて粉末をほぐし、パケットのお水を加えて、ボトルを閉める。　ボトルを閉めて良く振り、均一にする。",
 "粉末シロップの作り方：ボトルを数回たたいて粉をほぐし、沸騰させて冷ました水を線まで加えます。ふたを閉めてよく振り、均一にしてください。"
];
let notes = (() => { try { const a = JSON.parse(localStorage.getItem(KEY + ":notes")); if (Array.isArray(a)) return a; } catch (e) {} return [...NOTES]; })();
const AREAS = ["両目","左目","右目","両耳","左耳","右耳","両鼻","左鼻","右鼻"];

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const opts = (list, ph) => (ph ? `<option value="">${ph}</option>` : "") + list.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("");
const meds = $("#meds");

$("#drugs").innerHTML = DRUGS.map(d => `<option value="${d}">`).join("");

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove("on"), 2200);
}

function doseHTML(form) {
  const num = `<input type="number" min="0" step="0.5" inputmode="decimal" data-f="dose" aria-label="量">`;
  const area = `<select data-f="area" aria-label="使う場所">${opts(AREAS)}</select>`;
  if (form === "錠剤") return `<select data-f="dose" aria-label="用量">${opts(["1回1錠","1回半錠","1回2錠"], "用量を選択")}</select>`;
  if (form === "カプセル") return `<select data-f="dose" aria-label="用量">${opts(["1回1カプセル","1回2カプセル"], "用量を選択")}</select>`;
  if (form === "粉薬") return `<select data-f="dose" aria-label="用量">${opts(["1回1袋","1回半袋","1回2袋"], "用量を選択")}</select>`;
  if (form === "シロップ") return `1回${num}ml`;
  if (form === "点眼・点耳・点鼻") return `1回${num}滴${area}`;
  if (form === "スプレー") return `1回${num}噴霧${area}`;
  if (form === "その他") return `<input type="text" data-f="dose" placeholder="用量を入力" aria-label="用量">`;
  return "";
}

function timeOptions(row) {
  const list = FREQ[$('[data-f=freq]', row).value] || [];
  const sel = $('[data-f=time]', row);
  sel.innerHTML = opts(list, "服用タイミング");
  sel.disabled = !list.length;
}

function addRow(d = {}) {
  const row = document.createElement("section");
  row.className = "med";
  row.innerHTML = `
    <div class="head"><strong class="num"></strong>
      <label class="prn"><input type="checkbox" data-f="prn">頓服用（必要なときだけ）</label></div>
    <input type="text" data-f="name" list="drugs" placeholder="薬の名前" aria-label="薬の名前" autocomplete="off">
    <div class="err" hidden>薬の名前を入力してください。</div>
    <div class="grid">
      <div><select data-f="type" aria-label="薬の種類">${opts(TYPES, "薬の種類")}</select>
        <input type="text" data-f="typeOther" placeholder="種類を入力" aria-label="薬の種類（自由入力）" hidden style="margin-top:6px"></div>
      <select data-f="form" aria-label="薬の形状">${opts(FORMS, "薬の形状")}</select>
    </div>
    <div class="one">
      <div class="dose"></div>
      <select data-f="freq" aria-label="1日の回数">${opts(Object.keys(FREQ), "1日の回数")}</select>
      <select data-f="time" aria-label="服用タイミング" disabled><option value="">服用タイミング</option></select>
    </div>
    <div class="one">
      <select data-f="food" aria-label="食前・食後">${opts(FOOD, "食前/食後")}</select>
      <input type="number" min="1" inputmode="numeric" data-f="durN" placeholder="期間の数" aria-label="期間の数">
      <select data-f="durT" aria-label="期間の単位">${opts(["日間","週間","ヶ月間"], "単位")}</select>
    </div>
    <div class="notewrap"><select data-f="note" aria-label="注意書き">${opts(notes, "注意書きを選択")}</select><button type="button" data-act="notes">注意書きを編集</button></div>
    <textarea data-f="memo" rows="2" placeholder="メモ" aria-label="メモ" style="margin-top:8px"></textarea>
    <div class="acts"><button type="button" data-act="dup">複製</button><button type="button" class="del" data-act="del">削除</button></div>`;
  meds.append(row);
  setData(row, d);
  renumber();
  return row;
}

function getData(row) {
  const o = {};
  row.querySelectorAll("[data-f]").forEach(el => o[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value.trim());
  return o;
}

function setData(row, d) {
  const ns = $("[data-f=note]", row);
  if (d.note && ![...ns.options].some(o => o.value === d.note)) ns.add(new Option(d.note, d.note));
  const set = (f, v) => { const el = $(`[data-f=${f}]`, row); if (el && v !== undefined) el.type === "checkbox" ? el.checked = !!v : el.value = v; };
  set("form", d.form); $(".dose", row).innerHTML = doseHTML(d.form);
  set("freq", d.freq); timeOptions(row);
  for (const k in d) set(k, d[k]);
  $("[data-f=typeOther]", row).hidden = $("[data-f=type]", row).value !== "その他";
}

function renumber() {
  meds.querySelectorAll(".num").forEach((el, i) => el.textContent = (i + 1) + ".");
}

function doseText(d) {
  if (!d.dose) return "";
  const base = {"シロップ": `1回${d.dose}ml`, "点眼・点耳・点鼻": `1回${d.dose}滴`, "スプレー": `1回${d.dose}噴霧`}[d.form] || d.dose;
  return d.area ? `${base}（${d.area}）` : base;
}

function lines(d) {
  const type = d.type === "その他" && d.typeOther ? d.typeOther : d.type;
  const parts = [];
  if (d.prn) parts.push("頓服用（必要なときだけ）");
  [doseText(d), d.freq, d.time, d.food, d.durN && d.durT ? d.durN + d.durT : ""].forEach(p => p && parts.push(p));
  return { name: d.name, type, when: parts.join("・"), note: d.note, memo: d.memo };
}

function items() {
  return [...meds.children].map(getData).filter(d => d.name).map(lines);
}

const GREET = "平素よりお世話になっております。";
const HEAD = "本日、処方されたお薬の飲み方・使い方は下記でございます。";
const FOOT = "ご確認よろしくお願いいたします。";

function buildText() {
  const body = items().map((it, i) =>
    [`${i + 1}. ${it.name}`, it.type, it.when, it.note && "※ " + it.note, it.memo && "メモ: " + it.memo].filter(Boolean).join("\n")
  ).join("\n\n");
  return `${GREET}\n\n${HEAD}\n\n${body}\n\n${FOOT}`;
}

let custom = false;
const prev = $("#prevText");
function syncCustom() {
  $("#customNote").hidden = $("#resetText").hidden = !custom;
}
function refresh() {
  if (!custom) prev.value = items().length ? buildText() : "";
  try {
    localStorage.setItem(KEY, JSON.stringify([...meds.children].map(getData)));
    custom ? localStorage.setItem(KEY + ":text", prev.value) : localStorage.removeItem(KEY + ":text");
  } catch (e) {}
}
prev.addEventListener("input", () => { custom = true; syncCustom(); refresh(); });
$("#resetText").onclick = () => {
  if (!confirm("編集した内容は消え、入力内容から作り直します。よろしいですか？")) return;
  custom = false; syncCustom(); refresh(); toast("作り直しました");
};

function validate() {
  let first = null;
  [...meds.children].forEach(row => {
    const bad = !$("[data-f=name]", row).value.trim();
    row.classList.toggle("bad", bad);
    $(".err", row).hidden = !bad;
    if (bad && !first) first = row;
  });
  if (first) { first.scrollIntoView({behavior: "smooth", block: "center"}); $("[data-f=name]", first).focus(); toast("薬の名前が未入力の欄があります"); }
  return !first;
}

function renderSheet() {
  if (custom) {
    $("#sheet").innerHTML = `<div class="free">${esc(prev.value)}</div><p class="disc">この表は参考用です。医師・薬剤師の指示が最優先です。</p>`;
    return;
  }
  const date = new Date().toLocaleDateString("ja-JP", {year: "numeric", month: "long", day: "numeric"});
  $("#sheet").innerHTML = `<p>${GREET}</p><h1>${HEAD}</h1><p>${date}</p>` + items().map((it, i) => `
    <div class="item"><div class="nm">${i + 1}. ${esc(it.name)}${it.type ? `（${esc(it.type)}）` : ""}</div>
    <div class="when">${esc(it.when)}</div>
    ${it.note ? `<div>※ ${esc(it.note)}</div>` : ""}${it.memo ? `<div>メモ: ${esc(it.memo)}</div>` : ""}</div>`).join("") +
    `<p class="disc">${FOOT}<br>この表は参考用です。医師・薬剤師の指示が最優先です。</p>`;
}

function printSheet(msg) {
  if (!custom && !validate()) return;
  renderSheet();
  if (msg) toast(msg);
  setTimeout(() => window.print(), msg ? 700 : 0);
}

async function copy() {
  if (!custom && !validate()) return;
  const text = custom ? prev.value : buildText();
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = Object.assign(document.createElement("textarea"), {value: text});
    ta.style.cssText = "position:fixed;opacity:0";
    document.body.append(ta); ta.select();
    try { document.execCommand("copy"); } catch (_) { ta.remove(); return toast("コピーできませんでした。プレビューから手動でコピーしてください"); }
    ta.remove();
  }
  toast("コピーしました");
}

meds.addEventListener("input", e => {
  const row = e.target.closest(".med"); if (!row) return;
  const f = e.target.dataset.f;
  if (f === "name" && e.target.value.trim()) { row.classList.remove("bad"); $(".err", row).hidden = true; }
  refresh();
});
meds.addEventListener("change", e => {
  const row = e.target.closest(".med"); if (!row) return;
  const f = e.target.dataset.f;
  if (f === "form") $(".dose", row).innerHTML = doseHTML(e.target.value);
  if (f === "freq") timeOptions(row);
  if (f === "type") { const o = $("[data-f=typeOther]", row); o.hidden = e.target.value !== "その他"; if (o.hidden) o.value = ""; }
  refresh();
});
meds.addEventListener("click", e => {
  const act = e.target.dataset.act, row = e.target.closest(".med"); if (!act || !row) return;
  if (act === "notes") return openNotes();
  if (act === "del") {
    if (meds.children.length === 1) { row.remove(); addRow(); }
    else row.remove();
    renumber();
  }
  if (act === "dup") { const c = addRow(getData(row)); c.scrollIntoView({behavior: "smooth", block: "center"}); toast("複製しました"); }
  refresh();
});

const dlg = $("#notesDlg"), nl = $("#noteList");
function noteRow(t = "") {
  const r = document.createElement("div");
  r.className = "nrow";
  r.innerHTML = `<textarea rows="2" aria-label="注意書き">${esc(t)}</textarea><button type="button" class="del">削除</button>`;
  nl.append(r);
  return r;
}
function fillNotes(list) { nl.innerHTML = ""; list.forEach(noteRow); }
function openNotes() { fillNotes(notes); dlg.showModal(); }
nl.addEventListener("click", e => { if (e.target.classList.contains("del")) e.target.closest(".nrow").remove(); });
$("#noteAdd").onclick = () => { const r = noteRow(); r.scrollIntoView({block: "nearest"}); $("textarea", r).focus(); };
$("#noteReset").onclick = () => { if (confirm("注意書きを初期の内容に戻します（保存するまで反映されません）。よろしいですか？")) fillNotes(NOTES); };
$("#noteCancel").onclick = () => dlg.close();
$("#noteSave").onclick = () => {
  notes = [...new Set([...nl.querySelectorAll("textarea")].map(t => t.value.replace(/[ \t\r\n]+/g, " ").trim()).filter(Boolean))];
  try { localStorage.setItem(KEY + ":notes", JSON.stringify(notes)); } catch (e) {}
  meds.querySelectorAll("[data-f=note]").forEach(sel => {
    const cur = sel.value;
    sel.innerHTML = opts(notes, "注意書きを選択");
    if (cur && !notes.includes(cur)) sel.add(new Option(cur, cur));
    sel.value = cur;
  });
  refresh(); dlg.close(); toast("注意書きを保存しました");
};

$("#add").onclick = () => { const r = addRow(); r.scrollIntoView({behavior: "smooth", block: "center"}); $("[data-f=name]", r).focus(); refresh(); };
$("#copy").onclick = copy;
$("#print").onclick = () => printSheet();
$("#pdf").onclick = () => printSheet("印刷画面で「PDFに保存」を選んでください");
$("#clear").onclick = () => {
  if (!confirm("入力したすべての薬を消去します。よろしいですか？")) return;
  meds.innerHTML = ""; addRow(); custom = false; syncCustom(); refresh(); toast("消去しました");
};

try { (JSON.parse(localStorage.getItem(KEY)) || []).forEach(addRow); } catch (e) {}
if (!meds.children.length) addRow();
try { const t = localStorage.getItem(KEY + ":text"); if (t !== null) { custom = true; prev.value = t; } } catch (e) {}
syncCustom();
refresh();
</script>
</body>
</html>
